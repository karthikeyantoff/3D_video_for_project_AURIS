  <style>
    @keyframes pulseGlow {

      50% { box-shadow: 0 0 35px rgba(0,240,255,0.8), inset 0 0 20px rgba(0,240,255,0.4); }
    }
    .hud-border {
      border: 1px solid rgba(0, 240, 255, 0.3);
      position: relative;
    }
    .hud-border::before {
      content: '';
      position: absolute;
      top: -2px; left: -2px;
      width: 8px; height: 8px;
      border-top: 2px solid #00F0FF;
      border-left: 2px solid #00F0FF;
    }
    .hud-border::after {
      content: '';
      position: absolute;
      bottom: -2px; right: -2px;
      width: 8px; height: 8px;
      border-bottom: 2px solid #00F0FF;
      border-right: 2px solid #00F0FF;
    }
    .scanlines {
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));

      pointer-events: none;

    .text-glow-cyan {

          <div class="flex justify-between items-center border-b border-auris-border/40 pb-2">
            <div class="text-xs font-mono text-auris-cyan tracking-widest flex items-center gap-2">
              <span class="w-2 h-2 rounded-full bg-auris-cyan"></span>
              SECTION 08 • INNOVATION & CLOSING
            </div>
            <div class="text-xs font-mono text-slate-400">SMART INDIA HACKATHON 2026</div>
          </div>

          <div class="my-auto space-y-3">
            <div class="text-center space-y-0.5">
              <div class="text-[10px] font-mono text-auris-cyan font-bold tracking-wider uppercase">The 5 Pillars of Innovation</div>
              <h2 class="font-tactical text-2xl lg:text-4xl font-extrabold text-white">
                Adaptive Rescue <span class="text-auris-cyan text-glow-cyan">Intelligence</span>
              </h2>
            </div>

            <!-- 5 Innovation Cards -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2.5">
              <div class="p-2.5 bg-auris-card/90 hud-border rounded-xl space-y-1">
                <div class="flex items-center gap-1.5">
                  <span class="w-2 h-2 rounded-full bg-auris-orange"></span>
                  <span class="font-tactical font-bold text-white text-xs">1. UNCERTAINTY-AWARE SEARCH</span>
                </div>
                <p class="text-xs text-slate-300">Because "not detected does not mean not present" — eliminating false negatives.</p>
              </div>

              <div class="p-2.5 bg-auris-card/90 hud-border rounded-xl space-y-1">
                <div class="flex items-center gap-1.5">
                  <span class="w-2 h-2 rounded-full bg-auris-yellow"></span>
                  <span class="font-tactical font-bold text-white text-xs">2. MULTI-SENSOR VERIFICATION</span>
                </div>
                <p class="text-xs text-slate-300">RGB, thermal, and acoustic evidence combined to strengthen survivor assessments.</p>
              </div>

              <div class="p-2.5 bg-auris-card/90 hud-border rounded-xl space-y-1">
                <div class="flex items-center gap-1.5">
                  <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                  <span class="font-tactical font-bold text-white text-xs">3. NEXT-BEST-VIEW REINSPECTION</span>
                </div>
                <p class="text-xs text-slate-300">Gathers additional evidence from better viewpoints when current line-of-sight is insufficient.</p>
              </div>

              <div class="p-2.5 bg-auris-card/90 hud-border rounded-xl space-y-1">
                <div class="flex items-center gap-1.5">
                  <span class="w-2 h-2 rounded-full bg-indigo-400"></span>
                  <span class="font-tactical font-bold text-white text-xs">4. SEARCH MEMORY</span>
                </div>
                <p class="text-xs text-slate-300">Tracks explored and uncertain areas to support more informed search patterns.</p>
              </div>

              <div class="p-2.5 bg-auris-card/90 hud-border rounded-xl space-y-1">
                <div class="flex items-center gap-1.5">
                  <span class="w-2 h-2 rounded-full bg-rose-400"></span>
                  <span class="font-tactical font-bold text-white text-xs">5. RISK-AWARE PLANNING</span>
                </div>
                <p class="text-xs text-slate-300">Considers hazards, battery, communication, and search priorities dynamically.</p>
              </div>

              <div class="p-2.5 bg-auris-card/90 hud-border rounded-xl space-y-1">
                <div class="flex items-center gap-1.5">
                  <span class="w-2 h-2 rounded-full bg-auris-cyan"></span>
                  <span class="font-tactical font-bold text-white text-xs">CONTINUOUS CLOSED-LOOP</span>
                </div>
                <p class="text-xs text-slate-300">Sense ➔ Verify ➔ Decide ➔ Replan: Transforming data into action.</p>
              </div>
            </div>

            <!-- Closing Statement Card -->
            <div class="p-3 bg-gradient-to-r from-auris-panel via-slate-900 to-auris-panel hud-border rounded-xl text-center space-y-0.5">
              <p class="text-xs md:text-sm font-tactical text-slate-200">
                “Because in a disaster, seeing everything is impossible. But an intelligent system can decide <span class="text-auris-cyan font-bold">what to look at next</span>.”
              </p>
              <div class="text-xs font-mono text-auris-yellow font-bold">
                AURIS • SENSE • VERIFY • DECIDE • REPLAN • TEAM NEXUS FORGE
              </div>
            </div>
          </div>

          <div class="flex justify-between text-xs font-mono text-slate-400 border-t border-auris-border/40 pt-2">
            <span>TEAM NEXUS FORGE • SIH 2026</span>

          </div>

      `;
    }

    // ==========================================
    // 3. CONTROLLER & AUDIO PLAYBACK ENGINE
    // ==========================================

    function initNavigationDots() {
      navDots.innerHTML = "";
      SECTIONS.forEach((sec, idx) => {
        const dot = document.createElement("button");
        dot.className = `w-4 sm:w-5 h-2 rounded-sm transition-all duration-300 ${idx === 0 ? 'bg-auris-cyan w-7' : 'bg-slate-700 hover:bg-slate-500'}`;
        dot.title = sec.title;
        dot.onclick = () => jumpToSection(idx);
        navDots.appendChild(dot);
      });
    }

    function updateSlide(idx) {
      if (idx < 0 || idx >= SECTIONS.length) return;
      currentSectionIdx = idx;
      const sec = SECTIONS[idx];
      
      // Update Slide HTML
      slideContent.innerHTML = sec.render();
      currentSectionTitle.textContent = `${sec.num}. ${sec.title}`;
      subtitleText.textContent = sec.sub || "";
      
      // Update nav dots
      Array.from(navDots.children).forEach((d, i) => {
        d.className = `h-2 rounded-sm transition-all duration-300 ${i === idx ? 'bg-auris-cyan w-7 shadow-lg shadow-auris-cyan/50' : 'bg-slate-700 hover:bg-slate-500 w-4 sm:w-5'}`;
      });

      // Update Audio Source
      audio.src = sec.audio;
      if (isPlaying) {
        audio.play().catch(e => console.log("Audio play deferred:", e));
      }
    }

    function jumpToSection(idx) {
      updateSlide(idx);
    }

    function togglePlay() {
      if (isPlaying) {
        audio.pause();
        isPlaying = false;
        document.getElementById("playIcon").textContent = "▶";
        document.getElementById("playText").textContent = "RESUME";
      } else {
        if (!audio.src || audio.src === "") {
          audio.src = SECTIONS[currentSectionIdx].audio;
        }
        audio.play().then(() => {
          isPlaying = true;
          document.getElementById("playIcon").textContent = "⏸";
          document.getElementById("playText").textContent = "PAUSE";
        }).catch(err => {
          console.error("Playback failed:", err);
        });
      }
    }

    audio.onended = () => {
      if (currentSectionIdx < SECTIONS.length - 1) {
        currentSectionIdx++;
        updateSlide(currentSectionIdx);
        audio.play();
      } else {
        isPlaying = false;
        document.getElementById("playIcon").textContent = "▶";
        document.getElementById("playText").textContent = "REPLAY ALL";
      }
    };

    audio.ontimeupdate = () => {
      if (audio.duration) {
        const pct = (audio.currentTime / audio.duration) * 100;
        progressBar.style.width = `${pct}%`;
        
        const curM = Math.floor(audio.currentTime / 60);
        const curS = Math.floor(audio.currentTime % 60);
        const durM = Math.floor(audio.duration / 60);
        const durS = Math.floor(audio.duration % 60);
        timeElapsed.textContent = `${String(curM).padStart(2, '0')}:${String(curS).padStart(2, '0')}`;
        timeTotal.textContent = `${String(durM).padStart(2, '0')}:${String(durS).padStart(2, '0')}`;
      }
    };

    document.getElementById("btnPlay").onclick = togglePlay;
    document.getElementById("btnPrev").onclick = () => {
      if (currentSectionIdx > 0) jumpToSection(currentSectionIdx - 1);
    };
    document.getElementById("btnNext").onclick = () => {
      if (currentSectionIdx < SECTIONS.length - 1) jumpToSection(currentSectionIdx + 1);
    };

    // Keyboard shortcuts
    window.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        togglePlay();
      } else if (e.code === "ArrowRight") {
        if (currentSectionIdx < SECTIONS.length - 1) jumpToSection(currentSectionIdx + 1);
      } else if (e.code === "ArrowLeft") {
        if (currentSectionIdx > 0) jumpToSection(currentSectionIdx - 1);
      }
    });

    // ==========================================
    // 4. THREE.JS TACTICAL BACKGROUND
    // ==========================================
    function init3DBackground() {
      const container = document.getElementById("canvas-container");
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      container.appendChild(renderer.domElement);

      const droneGroup = new THREE.Group();
      
      // Central body
      const bodyGeo = new THREE.CylinderGeometry(1.2, 1.4, 0.4, 6);
      const bodyMat = new THREE.MeshBasicMaterial({ color: 0x00F0FF, wireframe: true });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      droneGroup.add(body);

      // 6 Arms and Rotors
      for (let i = 0; i < 6; i++) {
        const angle = (i * Math.PI) / 3;
        const armGeo = new THREE.CylinderGeometry(0.08, 0.08, 3.5);
        const armMat = new THREE.MeshBasicMaterial({ color: 0x00F0FF, wireframe: true });
        const arm = new THREE.Mesh(armGeo, armMat);
        arm.rotation.z = Math.PI / 2;
        arm.rotation.y = angle;
        arm.position.x = Math.cos(angle) * 1.75;
        arm.position.z = Math.sin(angle) * 1.75;
        droneGroup.add(arm);

        const rotorGeo = new THREE.RingGeometry(0.8, 0.9, 16);
        const rotorMat = new THREE.MeshBasicMaterial({ color: 0xFF6B00, wireframe: true, side: THREE.DoubleSide });
        const rotor = new THREE.Mesh(rotorGeo, rotorMat);
        rotor.rotation.x = Math.PI / 2;
        rotor.position.x = Math.cos(angle) * 3.5;
        rotor.position.z = Math.sin(angle) * 3.5;
        rotor.position.y = 0.2;
        droneGroup.add(rotor);
      }

      // Add Particles
      const particleCount = 150;
      const particlesGeo = new THREE.BufferGeometry();
      const posArray = new Float32Array(particleCount * 3);
      for(let i=0; i < particleCount * 3; i++) {
        posArray[i] = (Math.random() - 0.5) * 40;
      }
      particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
      const particleMat = new THREE.PointsMaterial({ size: 0.15, color: 0x00F0FF, transparent: true, opacity: 0.35 });
      const particles = new THREE.Points(particlesGeo, particleMat);
      scene.add(particles);

      scene.add(droneGroup);
      droneGroup.position.set(10, -2, -14);
      droneGroup.rotation.x = 0.35;
      droneGroup.rotation.y = -0.4;

      camera.position.z = 10;

      function animate() {
        requestAnimationFrame(animate);
        droneGroup.rotation.y += 0.003;
        droneGroup.position.y = -2 + Math.sin(Date.now() * 0.0015) * 0.4;
        particles.rotation.y += 0.0006;
        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    // ==========================================
    // 5. 1080P VIDEO RECORDER MODULE
    // ==========================================
    let mediaRecorder = null;
    let recordedChunks = [];
    const btnRecord = document.getElementById("btnRecord");
    const recText = document.getElementById("recText");

    btnRecord.onclick = async () => {
      if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
        recText.textContent = "REC 1080P";
        btnRecord.classList.remove("bg-rose-600", "animate-pulse");
      } else {
        try {
          const stream = await navigator.mediaDevices.getDisplayMedia({
            video: { displaySurface: "browser", width: 1920, height: 1080, frameRate: 60 },
            audio: true
          });
          
          recordedChunks = [];
          mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9,opus' });

          mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) recordedChunks.push(e.data);
          };

          mediaRecorder.onstop = () => {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `AURIS_SIH2026_Full_Video_Presentation.webm`;
            a.click();
            URL.revokeObjectURL(url);
          };

          mediaRecorder.start();
          recText.textContent = "RECORDING (STOP)";
          btnRecord.classList.add("bg-rose-600", "animate-pulse");
          
          jumpToSection(0);
          if (!isPlaying) togglePlay();

        } catch (err) {
          alert("Recording cancelled: " + err.message);
        }
      }
    };

    window.onload = () => {
      initNavigationDots();
      updateSlide(0);
      init3DBackground();
    };
  </script>
</body>
