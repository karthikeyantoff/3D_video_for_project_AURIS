    .hud-border {

      position: relative;
    }
    .hud-border::before {
      content: '';
      position: absolute;
      top: -2px; left: -2px;
      width: 8px; height: 8px;
      border-top: 2px solid #00F0FF;
      border-left: 2px solid #00F0FF;
    }
    .hud-border::after {
      content: '';
      position: absolute;
      bottom: -2px; right: -2px;
      width: 8px; height: 8px;
      border-bottom: 2px solid #00F0FF;
      border-right: 2px solid #00F0FF;

    .scanlines {

                    <div class="grid grid-cols-3 gap-1.5 text-[10px] font-mono">
                      <div class="p-1 bg-slate-900 rounded">GPS: 13.0827°N, 80.2707°E</div>
                      <div class="p-1 bg-slate-900 rounded">CONFIDENCE: 91.4%</div>
                      <div class="p-1 bg-slate-900 rounded">TEMP: 37.1°C BODY</div>
                    </div>
                    <div class="p-1.5 bg-slate-900 rounded text-[10px] font-mono text-auris-cyan">
                      CLOSED-LOOP REPLAN: Search memory updated. Hexacopter ascending to 20m AGL for secondary sweep.
                    </div>
                  </div>
                </div>
                <div class="text-xs font-mono text-slate-500 border-t border-auris-border/40 pt-2">SECTION 06.4 MISSION OPERATIONS</div>
              </div>
            `
          }
        ]
      },
      {
        id: "section_07",
        num: "07",
        title: "INNOVATION & CLOSING",
        audio: "audio/section_07.mp3",
        subscenes: [
          {
            time: 0.0,
            cam: { x: 0, y: 0, z: 8, rotX: 0.1, rotY: 0 },
            sub: "“AURIS transforms uncertain sensor information into adaptive rescue decisions: From detection, to verification, to decision, and finally, replanning. We are Team AURIS. Thank you.”",
            html: () => `
              <div class="h-full flex flex-col justify-between scene-fade">
                <div class="text-xs font-mono text-auris-cyan">THE 6 PILLARS OF ADAPTIVE RESCUE INTELLIGENCE</div>
                <div class="grid grid-cols-2 md:grid-cols-3 gap-2.5 my-auto">
                  <div class="p-2.5 bg-auris-card hud-border rounded-xl">
                    <div class="text-xs font-tactical font-bold text-auris-orange">1. UNCERTAINTY SEARCH</div>
                    <div class="text-[10px] text-slate-300">Not detected ≠ not present</div>
                  </div>
                  <div class="p-2.5 bg-auris-card hud-border rounded-xl">
                    <div class="text-xs font-tactical font-bold text-auris-yellow">2. MULTI-SENSOR FUSION</div>
                    <div class="text-[10px] text-slate-300">RGB + Thermal + Audio</div>
                  </div>
                  <div class="p-2.5 bg-auris-card hud-border rounded-xl">
                    <div class="text-xs font-tactical font-bold text-emerald-400">3. NEXT-BEST-VIEW</div>
                    <div class="text-[10px] text-slate-300">Active viewpoint search</div>
                  </div>
                  <div class="p-2.5 bg-auris-card hud-border rounded-xl">
                    <div class="text-xs font-tactical font-bold text-indigo-400">4. SEARCH MEMORY</div>
                    <div class="text-[10px] text-slate-300">Voxel-based exploration grid</div>
                  </div>
                  <div class="p-2.5 bg-auris-card hud-border rounded-xl">
                    <div class="text-xs font-tactical font-bold text-rose-400">5. RISK PLANNING</div>
                    <div class="text-[10px] text-slate-300">Hazard & battery awareness</div>
                  </div>
                  <div class="p-2.5 bg-auris-card hud-border rounded-xl">
                    <div class="text-xs font-tactical font-bold text-auris-cyan">6. CLOSED RESCUE LOOP</div>
                    <div class="text-[10px] text-slate-300">Sense • Verify • Decide • Replan</div>
                  </div>
                </div>
                <div class="p-3 bg-gradient-to-r from-auris-panel via-slate-900 to-auris-panel hud-border rounded-xl text-center">
                  <div class="text-base font-tactical font-bold text-white">AURIS — Autonomous Uncertainty-aware Rescue Intelligence System</div>
                  <div class="text-xs font-mono text-auris-yellow mt-0.5">TEAM AURIS • SMART INDIA HACKATHON 2026</div>
                </div>
                <div class="text-xs font-mono text-slate-500 border-t border-auris-border/40 pt-2">SIH 2026 PRESENTATION</div>
              </div>
            `
          }
        ]
      }
    ];

    let currentSectionIdx = 0;
    let currentSubsceneIdx = 0;
    let isPlaying = false;
    const audio = document.getElementById("audioPlayer");
    const slideContent = document.getElementById("slideContent");
    const subtitleText = document.getElementById("subtitleText");
    const currentSectionTitle = document.getElementById("currentSectionTitle");
    const progressBar = document.getElementById("progressBar");
    const timeElapsed = document.getElementById("timeElapsed");
    const timeTotal = document.getElementById("timeTotal");
    const navDots = document.getElementById("navDots");

    // =========================================================================
    // 2. THREE.JS CAMERA FLIGHT & BACKGROUND SCENE
    // =========================================================================
    let threeCamera, droneGroup, scene, renderer;

    function init3DBackground() {
      const container = document.getElementById("canvas-container");
      scene = new THREE.Scene();
      threeCamera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      container.appendChild(renderer.domElement);

      droneGroup = new THREE.Group();
      
      // Central body
      const bodyGeo = new THREE.CylinderGeometry(1.2, 1.4, 0.4, 6);
      const bodyMat = new THREE.MeshBasicMaterial({ color: 0x00F0FF, wireframe: true });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      droneGroup.add(body);

      // 6 Arms and Rotors
      for (let i = 0; i < 6; i++) {
        const angle = (i * Math.PI) / 3;
        const armGeo = new THREE.CylinderGeometry(0.08, 0.08, 3.5);
        const armMat = new THREE.MeshBasicMaterial({ color: 0x00F0FF, wireframe: true });
        const arm = new THREE.Mesh(armGeo, armMat);
        arm.rotation.z = Math.PI / 2;
        arm.rotation.y = angle;
        arm.position.x = Math.cos(angle) * 1.75;
        arm.position.z = Math.sin(angle) * 1.75;
        droneGroup.add(arm);

        const rotorGeo = new THREE.RingGeometry(0.8, 0.9, 16);
        const rotorMat = new THREE.MeshBasicMaterial({ color: 0xFF6B00, wireframe: true, side: THREE.DoubleSide });
        const rotor = new THREE.Mesh(rotorGeo, rotorMat);
        rotor.rotation.x = Math.PI / 2;
        rotor.position.x = Math.cos(angle) * 3.5;
        rotor.position.z = Math.sin(angle) * 3.5;
        rotor.position.y = 0.2;
        droneGroup.add(rotor);
      }

      // Add Particles
      const particleCount = 150;
      const particlesGeo = new THREE.BufferGeometry();
      const posArray = new Float32Array(particleCount * 3);
      for(let i=0; i < particleCount * 3; i++) {
        posArray[i] = (Math.random() - 0.5) * 40;
      }
      particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
      const particleMat = new THREE.PointsMaterial({ size: 0.15, color: 0x00F0FF, transparent: true, opacity: 0.35 });
      const particles = new THREE.Points(particlesGeo, particleMat);
      scene.add(particles);

      scene.add(droneGroup);
      threeCamera.position.set(0, 0, 9);

      function animate() {
        requestAnimationFrame(animate);
        droneGroup.rotation.y += 0.003;
        droneGroup.position.y = Math.sin(Date.now() * 0.0015) * 0.3;
        particles.rotation.y += 0.0006;
        renderer.render(scene, threeCamera);
      }
      animate();

      window.addEventListener('resize', () => {
        threeCamera.aspect = window.innerWidth / window.innerHeight;
        threeCamera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    function moveCameraTo(camTarget) {
      if (!threeCamera || !camTarget) return;
      threeCamera.position.set(camTarget.x, camTarget.y, camTarget.z);
      threeCamera.rotation.x = camTarget.rotX || 0;
      threeCamera.rotation.y = camTarget.rotY || 0;
    }

    // =========================================================================
    // 3. SLIDE & SUB-SCENE CONTROLLER
    // =========================================================================
    function initNavigationDots() {
      navDots.innerHTML = "";
      SECTIONS.forEach((sec, idx) => {
        const dot = document.createElement("button");
        dot.className = `w-5 sm:w-6 h-2 rounded-sm transition-all duration-300 ${idx === 0 ? 'bg-auris-cyan w-8' : 'bg-slate-700 hover:bg-slate-500'}`;
        dot.title = sec.title;
        dot.onclick = () => jumpToSection(idx);
        navDots.appendChild(dot);
      });
    }

    function setSubscene(secIdx, subIdx) {
      const sec = SECTIONS[secIdx];
      if (!sec || !sec.subscenes || !sec.subscenes[subIdx]) return;
      currentSubsceneIdx = subIdx;
      const sub = sec.subscenes[subIdx];
      
      slideContent.innerHTML = sub.html();
      subtitleText.textContent = sub.sub;
      moveCameraTo(sub.cam);
    }

    function updateSection(idx) {
      if (idx < 0 || idx >= SECTIONS.length) return;
      currentSectionIdx = idx;
      currentSubsceneIdx = 0;
      const sec = SECTIONS[idx];
      
      currentSectionTitle.textContent = `${sec.num}. ${sec.title}`;
      setSubscene(idx, 0);

      // Update nav dots
      Array.from(navDots.children).forEach((d, i) => {
        d.className = `h-2 rounded-sm transition-all duration-300 ${i === idx ? 'bg-auris-cyan w-8 shadow-lg shadow-auris-cyan/50' : 'bg-slate-700 hover:bg-slate-500 w-5 sm:w-6'}`;
      });

      audio.src = sec.audio;
      if (isPlaying) {
        audio.play().catch(e => console.log("Audio deferred:", e));
      }
    }

    function jumpToSection(idx) {
      updateSection(idx);
    }

    function togglePlay() {
      if (isPlaying) {
        audio.pause();
        isPlaying = false;
        document.getElementById("playIcon").textContent = "▶";
        document.getElementById("playText").textContent = "RESUME";
      } else {
        if (!audio.src || audio.src === "") {
          audio.src = SECTIONS[currentSectionIdx].audio;
        }
        audio.play().then(() => {
          isPlaying = true;
          document.getElementById("playIcon").textContent = "⏸";
          document.getElementById("playText").textContent = "PAUSE";
        }).catch(err => {
          console.error("Playback failed:", err);
        });
      }
    }

    audio.onended = () => {
      if (currentSectionIdx < SECTIONS.length - 1) {
        currentSectionIdx++;
        updateSection(currentSectionIdx);
        audio.play();
      } else {
        isPlaying = false;
        document.getElementById("playIcon").textContent = "▶";
        document.getElementById("playText").textContent = "REPLAY ALL";
      }
    };

    // Voice-synced sub-scene triggering
    audio.ontimeupdate = () => {
      if (!audio.duration) return;

      const curTime = audio.currentTime;
      const pct = (curTime / audio.duration) * 100;
      progressBar.style.width = `${pct}%`;
      
      const curM = Math.floor(curTime / 60);
      const curS = Math.floor(curTime % 60);
      const durM = Math.floor(audio.duration / 60);
      const durS = Math.floor(audio.duration % 60);
      timeElapsed.textContent = `${String(curM).padStart(2, '0')}:${String(curS).padStart(2, '0')}`;
      timeTotal.textContent = `${String(durM).padStart(2, '0')}:${String(durS).padStart(2, '0')}`;

      const sec = SECTIONS[currentSectionIdx];
      if (sec && sec.subscenes) {
        let activeIdx = 0;
        for (let i = 0; i < sec.subscenes.length; i++) {
          if (curTime >= sec.subscenes[i].time) {
            activeIdx = i;
          } else {
            break;
          }
        }
        if (activeIdx !== currentSubsceneIdx) {
          setSubscene(currentSectionIdx, activeIdx);
        }
      }
    };

    document.getElementById("btnPlay").onclick = togglePlay;
    document.getElementById("btnPrev").onclick = () => {
      if (currentSectionIdx > 0) jumpToSection(currentSectionIdx - 1);
    };
    document.getElementById("btnNext").onclick = () => {
      if (currentSectionIdx < SECTIONS.length - 1) jumpToSection(currentSectionIdx + 1);
    };

    // Keyboard shortcuts
    window.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        togglePlay();
      } else if (e.code === "ArrowRight") {
        if (currentSectionIdx < SECTIONS.length - 1) jumpToSection(currentSectionIdx + 1);
      } else if (e.code === "ArrowLeft") {
        if (currentSectionIdx > 0) jumpToSection(currentSectionIdx - 1);
      }
    });

    // 1080P Screen/Tab Recording
    let mediaRecorder = null;
    let recordedChunks = [];
    const btnRecord = document.getElementById("btnRecord");
    const recText = document.getElementById("recText");

    btnRecord.onclick = async () => {
      if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
        recText.textContent = "REC 1080P";
        btnRecord.classList.remove("bg-rose-600", "animate-pulse");
      } else {
        try {
          const stream = await navigator.mediaDevices.getDisplayMedia({
            video: { displaySurface: "browser", width: 1920, height: 1080, frameRate: 60 },
            audio: true
          });
          
          recordedChunks = [];
          mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9,opus' });

          mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) recordedChunks.push(e.data);
          };

          mediaRecorder.onstop = () => {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `AURIS_SIH2026_Full_Video_Presentation.webm`;
            a.click();
            URL.revokeObjectURL(url);
          };

          mediaRecorder.start();
          recText.textContent = "RECORDING (STOP)";
          btnRecord.classList.add("bg-rose-600", "animate-pulse");
          
          jumpToSection(0);
          if (!isPlaying) togglePlay();

        } catch (err) {
          alert("Recording cancelled: " + err.message);
        }
      }
    };

    window.onload = () => {
      initNavigationDots();
      init3DBackground();
      updateSection(0);
    };
  </script>
</body>
</html>
